<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MOPS LAB</title>
<style>


:root{

  --bg:        #0B0B0B;
  --grid:      #171717;
  --grid-maj:  #222020;
  --panel:     #0E0E0E;
  --node:      #141414;
  --node-audio:#101010;
  --node-hi:   #1B1B1B;
  --rule:      #2A2724;
  --faint:     #3A3631;

  --ink:       #EDEAE3;
  --dim:       #6E6A63;
  --red:       #D8321E;
  --red-dim:   #6E1B10;
  --red-wash:  rgba(216,50,30,.14);

  --ui:   "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;

  --grid-size: 20px;
  --node-w:   160px;
  --node-h:    72px;
  --port:      10px;

  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

*,*::before,*::after{ box-sizing:border-box; border-radius:0; }

html,body{
  margin:0; padding:0; height:100%; width:100%;
  background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:11.5px; line-height:1.45;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,input,select,textarea{ font:inherit; color:inherit; background:none; border:0; }

:focus{ outline:none; }
:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

#app{
  position:fixed; inset:0;
  display:block;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

#stage{
  position:absolute; inset:0;
  background:var(--bg);
  outline:none;
  cursor:default;
  touch-action:none;
  overflow:hidden;
}

#stage.is-panning{ cursor:grabbing; }

#grid{
  position:absolute; inset:0;
  display:block;
  pointer-events:none;
}

#grain{
  position:absolute; inset:0;
  pointer-events:none;
  opacity:.05;
  background-image:var(--grain);
  background-repeat:repeat;
}

#world{
  position:absolute; left:0; top:0; width:0; height:0;
  transform-origin:0 0;
}

.node-layer{ position:absolute; left:0; top:0; width:0; height:0; }

#cables{
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  overflow:visible;
}

.cable{
  fill:none;
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
  stroke-linecap:round;
  pointer-events:none;
}

.cable.is-audio{ stroke:var(--ink);  stroke-opacity:.55; }
.cable.is-cd   { stroke:var(--red);  stroke-opacity:.75; }

.cable.is-dragging{ stroke-dasharray:4 3; stroke-opacity:1; }

.cable-tick{
  fill:none;
  stroke:var(--red);
  stroke-width:3;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}

.cable.is-selected{ stroke-opacity:1; stroke-width:2.5; }

.cable-hit{
  fill:none;
  stroke:transparent;
  stroke-width:8;
  vector-effect:non-scaling-stroke;
  pointer-events:stroke;
  cursor:pointer;
}

.cable-hit:hover + .cable{ stroke-opacity:1 !important; }

.port{
  position:absolute;
  width:var(--port); height:var(--port);
  margin-top:calc(var(--port) / -2);
  border:1px solid transparent;
  cursor:crosshair;
  touch-action:none;
}

.port.is-in { left:calc(var(--port) / -2); }
.port.is-out{ right:calc(var(--port) / -2); }

.port.is-audio{ background:rgba(237,234,227,.4); }
.port.is-cd   { background:rgba(216,50,30,.4); }

.port.is-audio.is-connected{ background:var(--ink); }
.port.is-cd.is-connected   { background:var(--red); }

.port:hover.is-audio, .port.is-hot.is-audio{ background:var(--ink); border-color:var(--bg); outline:1px solid var(--ink); }
.port:hover.is-cd,    .port.is-hot.is-cd   { background:var(--red); border-color:var(--bg); outline:1px solid var(--red); }

.is-patching .port.is-valid.is-audio{ background:var(--ink); }
.is-patching .port.is-valid.is-cd   { background:var(--red); }
.is-patching .port.is-invalid{ opacity:.15; }

.port.is-refused{
  background:var(--red) !important;
  outline:1px solid var(--red);
  opacity:1 !important;
}

.port-label{
  display:none;
  position:absolute; top:50%;
  transform:translateY(-50%);
  padding:0 4px;
  background:var(--bg);
  font-family:var(--mono); font-size:8px; letter-spacing:.04em;
  color:var(--dim);
  white-space:nowrap;
  pointer-events:none;
}

.port.is-in  .port-label{ right:calc(100% + 4px); }
.port.is-out .port-label{ left:calc(100% + 4px); }

.port:hover .port-label{ display:block; }

#hint{
  position:absolute; left:50%; bottom:16px;
  z-index:31;
  transform:translateX(-50%);
  pointer-events:none;
  font-family:var(--mono); font-size:9px; letter-spacing:.04em;
  color:var(--dim);
  white-space:nowrap;
}

#hint.is-flash{ color:var(--red); }

.node-canvas{
  display:block;
  width:100%; height:100%;
}

.node.is-inactive .node-canvas{ opacity:.45; }

.node-inactive{
  order:-1;
  font-family:var(--mono); font-size:8px; letter-spacing:.1em;
  color:var(--red);
}

.node.is-inactive .node-name{ color:var(--dim); }

#status{
  position:absolute; right:14px; bottom:14px;
  z-index:35;
  display:flex; flex-direction:column; align-items:flex-end; gap:7px;
}

.status-row{ display:flex; align-items:center; gap:12px; }

.status-mute{
  padding:8px 16px;
  border:0;
  background:transparent;
  font-family:var(--ui); font-weight:700;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink);
  cursor:pointer;
  --hand:var(--ink);
}

.status-mute:hover{ background:var(--ink); color:var(--bg); }

.status-mute.is-muted{
  background:var(--red);
  color:var(--ink);
  --hand:var(--red);
}

.status-mute.is-muted:hover{ background:var(--red-dim); }
.status-mute:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

.status-item{
  font-family:var(--mono); font-size:9px; letter-spacing:.04em;
  color:var(--dim);
  white-space:nowrap;
}

.status-audio.is-on{ color:var(--ink); }
.status-audio:not(.is-on){ cursor:pointer; }
.status-audio:not(.is-on):hover{ color:var(--ink); }

.status-panic{
  padding:4px 8px;
  border:0;
  font-family:var(--ui); font-weight:700;
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--dim);
  cursor:pointer;
  --hand:var(--rule);
}

.status-panic:hover{ background:var(--red); color:var(--ink); --hand:var(--red); }
.status-panic:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

#teach{
  position:absolute; top:96px; left:16px;
  z-index:33;
  display:flex; gap:6px; flex-wrap:wrap;
  max-width:min(52ch, 60%);
}

#teach[hidden]{ display:none; }

.teach-btn{
  padding:4px 8px;
  border:0;
  background:transparent;
  font-family:var(--ui); font-weight:700;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim);
  cursor:pointer;
  --hand:var(--rule);
}

.teach-btn:hover{ color:var(--ink); --hand:var(--ink); }
.teach-btn.is-on{ background:var(--ink); color:var(--bg); --hand:var(--ink); }
.teach-btn:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

#guide{
  position:absolute; top:130px; left:16px;
  z-index:33;
  width:280px; max-width:calc(100% - 32px);
}

#guide[hidden], #info[hidden], #notes[hidden]{ display:none; }

.guide-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 10px 4px;
}

.guide-count{
  font-family:var(--mono); font-size:8.5px; letter-spacing:.1em;
  color:var(--dim);
}

.guide-text{
  margin:0;
  padding:0 10px 8px;
  font-family:var(--ui); font-size:11.5px; line-height:1.45;
  color:var(--ink);
}

.guide-nav{ display:flex; align-items:center; gap:2px; }

.guide-step-btn{
  width:16px; height:16px;
  border:0; background:transparent;
  font-family:var(--ui); font-size:13px; line-height:1;
  color:var(--dim);
  cursor:pointer;
}

.guide-step-btn:hover:not(:disabled){ color:var(--ink); }
.guide-step-btn:disabled{ color:var(--faint); cursor:default; }
.guide-step-btn:focus-visible{ outline:1px solid var(--ink); outline-offset:1px; }

.guide-dots{ display:flex; gap:3px; padding:0 10px 9px; }

.guide-dot{
  flex:1 1 0;
  height:6px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

.guide-dot::after{
  content:"";
  display:block;
  height:2px; margin-top:2px;
  background:var(--faint);
}

.guide-dot:hover::after{ background:var(--ink); }
.guide-dot.is-done::after{ background:var(--dim); }
.guide-dot.is-now::after{ background:var(--red); height:3px; margin-top:1px; }
.guide-dot:focus-visible{ outline:1px solid var(--ink); outline-offset:1px; }

#info{
  position:absolute; right:14px; top:14px;
  z-index:33;
  width:300px; max-width:calc(100% - 28px);
}

#params:not([hidden]) ~ #info{ top:auto; bottom:56px; }

#notes{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%, -50%);
  z-index:37;
  width:520px; max-width:calc(100% - 28px);
  max-height:calc(100% - 56px);
  overflow-y:auto;
}

.info-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:7px 10px 5px;
}

.info-title{
  font-family:var(--ui); font-weight:700;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink);
}

#info.is-cd .info-title{ color:var(--red); }

.info-close{
  flex:none;
  width:16px; height:16px;
  border:0; background:transparent;
  font-family:var(--ui); font-size:14px; line-height:1;
  color:var(--dim);
  cursor:pointer;
}

.info-close:hover{ color:var(--ink); }
.info-close:focus-visible{ outline:1px solid var(--ink); outline-offset:1px; }

.info-rule{ height:3px; --hand:var(--ink); }
#info.is-cd .info-rule{ --hand:var(--red); }

.info-body{ padding:9px 10px 11px; }

.info-p{
  margin:0;
  font-family:var(--ui); font-size:11.5px; line-height:1.45;
  color:var(--ink);
}

.info-p + .info-p{ margin-top:8px; }

.info-p.is-aside{ color:var(--dim); }

.info-lead{
  font-style:italic;
  color:var(--dim);
}

.info-p.is-aside .info-lead::after{ content:":"; }

.p-info{
  flex:none;
  width:14px; height:14px;
  border:0; background:transparent;
  font-family:var(--ui); font-weight:700; font-style:italic;
  font-size:10px; line-height:1;
  color:var(--dim);
  cursor:pointer;
}

.p-info:hover{ color:var(--ink); }
.p-info:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

.status-teach{
  padding:4px 8px;
  border:0;
  font-family:var(--ui); font-weight:700;
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint);
  cursor:pointer;
  --hand:var(--rule);
}

.status-teach.is-on{ color:var(--dim); }
.status-teach:hover{ color:var(--ink); --hand:var(--ink); }
.status-teach:focus-visible{ outline:1px solid var(--ink); outline-offset:2px; }

.node{
  position:absolute;
  width:var(--node-w); height:var(--node-h);
  display:flex; flex-direction:column;
  background:var(--node);
  border:0;
  color:var(--ink);
  cursor:default;
}

.node .node-canvas{
  position:absolute; inset:0;
  z-index:0;
}

.node.is-audio{ background:var(--node-audio); }

.node.is-cd{
  background:var(--node);
  border-color:rgba(216,50,30,.55);
  color:var(--red);
}

.node.is-audio:hover{ background:var(--node); }
.node.is-cd:hover{ background:var(--node-hi); }

.node .node-vis{
  flex:none; height:44px; margin:1px;
}

.node .node-foot{
  position:relative; z-index:1;
  flex:1 1 auto;
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:0 6px;
  overflow:hidden;
}

.node .node-name{
  font-family:var(--ui); font-weight:700;
  font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.node.is-cd .node-name{ color:var(--red); }

.node .node-type{
  font-family:var(--mono);
  font-size:8.5px; letter-spacing:.1em;
  color:var(--dim);
  white-space:nowrap;
}

#add-op{
  position:absolute; left:14px; bottom:14px;
  z-index:35;
  width:34px; height:34px;
  border:0;
  background:var(--panel);
  color:var(--ink);
  font-family:var(--ui); font-size:18px; line-height:1;
  cursor:pointer;
  --hand:var(--ink);
}

#add-op:hover, #add-op.is-open{
  color:var(--bg);
  background:var(--ink);
  --hand:var(--ink);
}

#zoom{
  position:absolute; right:14px; bottom:88px;
  z-index:35;
  display:flex; flex-direction:column; gap:4px;
}

#zoom button{
  width:34px; height:28px;
  border:0;
  background:var(--panel);
  color:var(--ink);
  font-family:var(--ui); font-weight:700;
  font-size:14px; line-height:1;
  letter-spacing:.04em;
  cursor:pointer;
  --hand:var(--ink);
}

#zoom #zoom-fit{ font-size:8px; letter-spacing:.12em; }

#zoom button:hover{
  color:var(--bg);
  background:var(--ink);
  --hand:var(--ink);
}

#zoom button:disabled{
  color:var(--dim);
  cursor:default;
  --hand:var(--rule);
}

#zoom button:disabled:hover{ background:var(--panel); color:var(--dim); }

.panel{
  position:relative;
  isolation:isolate;
  background:var(--panel);
  border:0;
}

.hand-frame{
  position:absolute; left:0; top:0;
  z-index:2;
  pointer-events:none;
  overflow:visible;
}

.hand-frame path{ stroke:var(--hand, var(--rule)); }

.is-hand{ position:relative; }

.panel::after{
  content:"";
  position:absolute; inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.045;
  background-image:var(--grain);
}

#oplist{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%, -50%);
  z-index:36;
  width:520px; max-width:calc(100% - 28px);
  outline:1px solid var(--rule);
  outline-offset:3px;
}

#oplist[hidden]{ display:none; }

.oplist-filter{
  display:block; width:100%;
  padding:10px 13px;
  border:0;
  background:transparent;
  font-family:var(--mono); font-size:10px; letter-spacing:.04em;
  color:var(--ink);
  outline:none;
}

.oplist-filter-wrap{ --hand:var(--rule); }

.oplist-filter::placeholder{ color:var(--faint); }
.oplist-filter:focus-visible{ outline:1px solid var(--ink); outline-offset:-1px; }

.oplist-cols{ display:flex; align-items:stretch; }

.oplist-col{ flex:1 1 50%; min-width:0; --hand:var(--rule); }

.oplist-col.is-audio{ background:var(--node-audio); }

.oplist-colhead{
  padding:10px 13px 7px;
  font-family:var(--ui); font-weight:700;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim);
  border:0;
  --hand:var(--rule);
}

.oplist-col.is-cd .oplist-colhead{ color:var(--red); --hand:var(--red-dim); }

.oplist-rows{ padding:5px 0 8px; min-height:150px; }

.oplist-row{
  display:block; width:100%;
  padding:5px 13px;
  text-align:left;
  cursor:pointer;
  border:1px solid transparent;
}

.oplist-row.is-hidden{ display:none; }

.oplist-label{
  display:block;
  font-family:var(--ui); font-weight:700;
  font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink);
}

.oplist-col.is-cd .oplist-label{ color:var(--red); }

.oplist-blurb{
  display:block;
  font-family:var(--mono); font-size:9px; letter-spacing:.04em;
  color:var(--dim);
}

.oplist-row.is-cursor,
.oplist-row:hover{ background:rgba(237,234,227,.07); }

.oplist-col.is-cd .oplist-row.is-cursor,
.oplist-col.is-cd .oplist-row:hover{ background:var(--red-wash); }

.oplist-row:focus-visible{ outline:1px solid var(--ink); outline-offset:-1px; }

.node.is-selected{
  outline:1px solid var(--ink);
  outline-offset:2px;
  background:var(--node-hi);
}

.node.is-cd.is-selected{ outline-color:var(--red); }

.node-rename{
  width:100%; min-width:0;
  padding:0;
  background:transparent;
  font-family:var(--ui); font-weight:700;
  font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink);
  outline:none;
  border-bottom:1px solid var(--ink);
}

.node.is-cd .node-rename{ color:var(--red); border-bottom-color:var(--red); }
.node-rename:focus-visible{ outline:1px solid var(--ink); outline-offset:1px; }

#marquee{
  position:absolute;
  z-index:5;
  border:1px solid var(--ink);
  background:rgba(237,234,227,.05);
  pointer-events:none;
}

#marquee[hidden]{ display:none; }

#params{
  position:absolute; top:14px; right:14px;
  z-index:34;
  width:280px;
  max-height:calc(100% - 28px);
  overflow-y:auto;
  overflow-x:hidden;
}

#params.is-wide{ width:320px; }
#params[hidden]{ display:none; }

.p-panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 10px 5px;
}

.p-title{
  font-family:var(--ui); font-weight:700;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim);
}

.p-id{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:0 10px 6px;
}

.p-name{
  flex:1 1 auto; min-width:0;
  padding:0;
  background:transparent;
  font-family:var(--ui); font-weight:700;
  font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink);
  outline:none;
}

#params.is-cd .p-name{ color:var(--red); }
.p-name:focus-visible{ outline:1px solid var(--ink); outline-offset:1px; }

.p-optype{
  flex:none;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.1em;
  color:var(--dim);
}

.p-rule{ height:3px; --hand:var(--ink); }
#params.is-cd .p-rule{ --hand:var(--red); }

.p-tabs{ display:flex; --hand:var(--rule); }

.p-tab{
  flex:1 1 auto;
  padding:5px 6px;
  border:0;
  font-family:var(--ui); font-weight:700;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim);
  cursor:pointer;
  --hand:var(--rule);
}
.p-tab:hover{ color:var(--ink); }
.p-tab:focus-visible{ outline:1px solid var(--ink); outline-offset:-2px; }
.p-tab.is-on{ background:var(--ink); color:var(--bg); }
#params.is-cd .p-tab.is-on{ background:var(--red); color:var(--ink); }

.p-body{ padding:10px; }

.p-row + .p-row{ margin-top:14px; }
.p-row.is-inline{ display:flex; align-items:center; justify-content:space-between; }

.p-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  margin-bottom:5px;
}

.p-label{
  font-family:var(--ui); font-weight:700;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim);
}

.p-val{
  font-family:var(--mono); font-size:15px; letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}

#params.is-cd .p-val{ color:var(--red); }

.p-empty{
  margin:0;
  font-family:var(--mono); font-size:9px; letter-spacing:.04em;
  color:var(--dim);
}

.p-slider{
  position:relative;
  height:18px;
  cursor:ew-resize;
  touch-action:none;
}

.p-rail{
  position:absolute; inset:0;
  --hand:var(--rule);
}

.p-thumb{
  position:absolute; top:1px;
  width:6px; height:16px;
  margin-left:-3px;
  background:var(--ink);
}

  bus.on("patch:edge-add", check);
  bus.on("patch:node-add", check);
  bus.on("patch:node-remove", check);

  apply();
